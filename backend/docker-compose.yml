services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nameassist
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d nameassist"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 config.wsgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - FRONTEND_URL=http://localhost:5173
      - EMAIL_DELIVERY_MODE=preview
      - DATABASE_URL=postgres://user:password@db:5432/nameassist
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
      - SECRET_KEY=secret
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - FRONTEND_URL=http://localhost:5173
      - EMAIL_DELIVERY_MODE=preview
      - DATABASE_URL=postgres://user:password@db:5432/nameassist
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
      - SECRET_KEY=secret
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_beat:
    build: .
    command: celery -A config beat -l info --schedule=/tmp/nameassist-celerybeat
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - FRONTEND_URL=http://localhost:5173
      - EMAIL_DELIVERY_MODE=preview
      - DATABASE_URL=postgres://user:password@db:5432/nameassist
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
      - SECRET_KEY=secret
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
