[project]
name = "backend"
version = "0.1.0"
description = "NameAssist backend"
authors = [
    {name = "Jules"}
]
requires-python = "^3.12"
dependencies = [
    "djangorestframework (>=3.18.1,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "google-auth (>=2.58.0,<3.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "django-storages (>=1.14.6,<2.0.0)",
    "boto3 (>=1.43.91,<2.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "django-filter (>=26.1,<27.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "psycopg[binary] (>=3.3.5,<4.0.0)",
    "django-environ (>=0.14.0,<0.15.0)",
    "gunicorn (>=26.2.0,<27.0.0)",
    "django (>=5.1,<6.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
    "pyotp (>=2.9,<3.0)",
    "cryptography (>=46.0,<51.0)",
    "requests (>=2.34.2,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
